name: Android APK Toolchain

on:
  push:
    paths:
      - ".github/workflows/android-tools.yml"
      - "toolchain/**"
  workflow_dispatch:

jobs:
  verify-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 --branch main https://github.com/antew1/antew.git "$GITHUB_WORKSPACE"

      - name: Set up Java 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "PATH=$JAVA_HOME/bin:$PATH" >> "$GITHUB_ENV"
          java -version

      - name: Install Android SDK build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.1.0:$PATH"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.1.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.1.0:$PATH" >> "$GITHUB_ENV"

          apksigner --version
          test -x "$ANDROID_HOME/build-tools/36.1.0/zipalign"

      - name: Install Apktool 3.0.3
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -O /tmp/apktool.jar
          java -jar /tmp/apktool.jar --version

      - name: Install JADX
        run: |
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -O /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d "$HOME/jadx"
          "$HOME/jadx/bin/jadx" --version

      - name: Save tool versions
        run: |
          mkdir -p toolchain
          {
            echo "Java:"
            java -version 2>&1
            echo "Apktool:"
            java -jar /tmp/apktool.jar --version
            echo "JADX:"
            "$HOME/jadx/bin/jadx" --version
            echo "apksigner:"
            apksigner --version
          } | tee toolchain/versions.txt

      - name: Verify toolchain
        run: |
          test -s toolchain/versions.txt
          grep -q "Apktool:" toolchain/versions.txt
          grep -q "JADX:" toolchain/versions.txt
          grep -q "apksigner:" toolchain/versions.txt
          echo "Android APK toolchain verification completed successfully."
