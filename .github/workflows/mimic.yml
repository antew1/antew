name: Mimic — установка и генератор

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mimic.yml
      - scripts/mimic_opencode.py
      - toolchain/mimic/**

permissions:
  contents: read

jobs:
  install-and-test:
    name: Установить и проверить Mimic с OpenCode
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Скачать конфигурацию интеграции
        run: |
          git init mimic-integration
          git -C mimic-integration remote add origin https://github.com/antew1/antew.git
          git -C mimic-integration fetch --depth=1 origin "$GITHUB_SHA"
          git -C mimic-integration checkout --detach FETCH_HEAD

      - name: Скачать исходный Mimic
        run: |
          git init mimic-source
          git -C mimic-source remote add origin https://github.com/littledivy/mimic.git
          git -C mimic-source fetch --depth=1 origin 8cf998ac0b365806d8e522d34107cc504ecaa345
          git -C mimic-source checkout --detach FETCH_HEAD
          test "$(git -C mimic-source rev-parse HEAD)" = "8cf998ac0b365806d8e522d34107cc504ecaa345"

      - name: Подготовить Python 3.12
        run: |
          python3.12 -m venv "$RUNNER_TEMP/mimic-venv"
          echo "$RUNNER_TEMP/mimic-venv/bin" >> "$GITHUB_PATH"

      - name: Установить Mimic, mitmproxy и зависимости
        working-directory: mimic-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[capture]' uv pytest
          python -m pip check

      - name: Установить OpenCode 1.18.35 и подключить к Mimic
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            https://github.com/anomalyco/opencode/releases/download/v1.18.35/opencode-linux-x64-baseline.tar.gz \
            -o "$RUNNER_TEMP/opencode.tar.gz"
          printf '%s  %s\n' 90c97d4a24d36437bce36f27195c9cd2e0b70ed037a04d1c6a6740eb246c2a73 "$RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode"
          install -m 755 mimic-integration/scripts/mimic_opencode.py "$RUNNER_TEMP/mimic-venv/bin/opencode"
          python - <<'PY'
          import os
          from pathlib import Path

          runner = Path(os.environ["RUNNER_TEMP"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          settings = {
              "MIMIC_OPENCODE_BINARY": runner / "opencode" / "opencode",
              "MIMIC_OPENCODE_CONFIG": workspace / "mimic-integration" / "toolchain" / "mimic" / "opencode.json",
              "MIMIC_OPENCODE_STATE_DIR": runner / "mimic-opencode-state",
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              for name, value in settings.items():
                  output.write(f"{name}={value}\n")
          PY

      - name: Проверить установленные команды
        run: |
          mimic --help
          mitmweb --version
          opencode --version

      - name: Проверить интеграцию OpenCode
        run: python -m unittest discover -s mimic-integration/toolchain/mimic -p test_opencode_adapter.py -v

      - name: Выполнить тесты Mimic
        working-directory: mimic-source
        run: python -m pytest -q

      - name: Проверить обработку HAR и подготовку генерации
        working-directory: mimic-source
        run: |
          mimic hosts --har tests/fixtures/sample.har
          mimic learn api.example.com --har tests/fixtures/sample.har
          mimic gen api.example.com --har tests/fixtures/sample.har --prompt-only > "$RUNNER_TEMP/mimic-example-prompt.txt"
          test -s "$RUNNER_TEMP/mimic-example-prompt.txt"

      - name: Проверить наличие ключа авторизации
        id: auth
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          ready = bool(os.environ.get("OPENCODE_API_KEY", "").strip())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if ready:
              print("Ключ OpenCode настроен.")
          else:
              print("::notice::Добавьте секрет OPENCODE_API_KEY для авторизации генератора. Генерация ещё не выполнялась.")
          PY

      - name: Создать пример Python-клиента через OpenCode
        id: generate
        if: steps.auth.outputs.ready == 'true'
        working-directory: mimic-source
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          mimic gen api.example.com --har tests/fixtures/sample.har --generator opencode --out "$RUNNER_TEMP/mimic-example-client.py"
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "mimic-example-client.py"
          tree = ast.parse(source.read_text(encoding="utf-8"))
          clients = [
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and any(
                  (isinstance(base, ast.Attribute) and base.attr == "App")
                  or (isinstance(base, ast.Name) and base.id == "App")
                  for base in node.bases
              )
          ]
          if not clients:
              raise RuntimeError("В ответе генератора отсутствует клиент на основе Mimic.App.")
          print("Python-клиент создан; синтаксис и класс клиента проверены.")
          PY

      - name: Сохранить результат проверки
        if: always() && steps.auth.conclusion == 'success'
        env:
          GENERATOR_AUTH_READY: ${{ steps.auth.outputs.ready }}
          GENERATOR_RESULT: ${{ steps.generate.conclusion }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from importlib.metadata import version

          ready = os.environ.get("GENERATOR_AUTH_READY") == "true"
          summary = (
              "## Mimic и OpenCode\n\n"
              f"- Mimic {version('mimic-client')} установлен.\n"
              "- OpenCode 1.18.35 установлен и подключён как генератор.\n"
              "- Проверки команд, интеграции и HAR пройдены.\n"
          )
          if ready and os.environ.get("GENERATOR_RESULT") == "success":
              summary += "- Авторизация выполнена, пример Python-клиента создан и проверен.\n"
              source = Path(os.environ["RUNNER_TEMP"]) / "mimic-example-client.py"
              summary += "\n### Пример клиента\n\n```python\n" + source.read_text(encoding="utf-8") + "\n```\n"
          elif ready:
              summary += (
                  "- Секрет OPENCODE_API_KEY сохранён и доступен workflow.\n"
                  "- Генерация не пройдена. Смотрите ошибку доступа OpenCode в журнале шага генерации.\n"
              )
          else:
              summary += (
                  "- Авторизация ожидается. Генерация кода пока не проверена.\n\n"
                  "Добавьте секрет OPENCODE_API_KEY: "
                  "https://github.com/antew1/antew/settings/secrets/actions\n"
                  "Затем нажмите Run workflow.\n"
              )
          summary += "\nСреда GitHub Actions действует только во время запуска workflow.\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write(summary)
          PY

