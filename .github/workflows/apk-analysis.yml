name: APK Analysis

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK URL"
        required: true
        type: string
      apk_sha256:
        description: "Optional SHA-256"
        required: false
        type: string

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner test
        run: |
          echo "APK Analysis runner started"
          java -version 2>&1 || true
          echo "APK URL supplied: ${{ inputs.apk_url != '' }}"

      - name: Test input
        run: |
          echo "APK URL:"
          printf '%s\n' '${{ inputs.apk_url }}'

      - name: Download APK
        run: |
          set -e
          mkdir -p work
          curl -fL --retry 2 --retry-all-errors '${{ inputs.apk_url }}' -o work/base.apk
          file work/base.apk
          ls -lh work/base.apk
