name: APK Analysis

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK URL"
        required: true
        type: string
      apk_sha256:
        description: "Optional SHA-256"
        required: false
        type: string

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner test
        run: |
          echo "APK Analysis runner started"
          java -version 2>&1 || true
          echo "APK URL supplied: ${{ inputs.apk_url != '' }}"

      - name: Test input
        run: |
          echo "APK URL:"
          printf '%s\n' '${{ inputs.apk_url }}'

      - name: Download APK
        run: |
          set -e
          mkdir -p work
          curl -fL --retry 2 --retry-all-errors '${{ inputs.apk_url }}' -o work/base.apk
          file work/base.apk
          ls -lh work/base.apk

      - name: Verify APK
        run: |
          set -e
          sha256sum work/base.apk
          test -s work/base.apk

      - name: Install Apktool
        run: |
          set -e
          mkdir -p tools
          curl -fL --retry 2 --retry-all-errors https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o tools/apktool.jar
          java -jar tools/apktool.jar --version
