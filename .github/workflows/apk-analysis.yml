name: APK Analysis

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK URL"
        required: true
        type: string
      apk_sha256:
        description: "Optional SHA-256"
        required: false
        type: string

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner test
        run: |
          echo "APK Analysis runner started"
          java -version 2>&1 || true
          echo "APK URL supplied: ${{ inputs.apk_url != '' }}"
