name: APK Analysis

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Google Drive or direct HTTPS APK URL"
        required: true
        type: string
      apk_sha256:
        description: "Optional SHA-256"
        required: false
        type: string

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner test
        run: |
          set -e
          echo "APK Analysis runner started"
          java -version 2>&1 || true

      - name: Download and verify APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          APK_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip unzip file curl
          mkdir -p work
          if [[ "$APK_URL" == *"drive.google.com"* ]]; then
            python3 -m pip install --quiet --break-system-packages gdown
            gdown --fuzzy "$APK_URL" -O work/base.apk
          else
            curl -fL --retry 3 --retry-all-errors "$APK_URL" -o work/base.apk
          fi
          test -s work/base.apk
          file work/base.apk
          unzip -tq work/base.apk >/dev/null
          sha256sum work/base.apk | tee work/apk.sha256
          if [[ -n "$APK_SHA256" ]]; then
            echo "$APK_SHA256  work/base.apk" | sha256sum -c -
          fi

      - name: Upload APK verification
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification
          path: |
            work/apk.sha256
            work/base.apk
          compression-level: 0
