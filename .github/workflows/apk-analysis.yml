name: APK Analysis

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK URL (not required; workflow uses the configured Google Drive APK)"
        required: false
        type: string
      apk_sha256:
        description: "Optional SHA-256"
        required: false
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Runner test
        run: |
          echo "APK Analysis runner started"
          java -version 2>&1 || true
          echo "APK URL supplied: ${{ inputs.apk_url != '' }}"

      - name: Test input
        run: |
          echo "APK URL:"
          printf '%s\n' '${{ inputs.apk_url }}'

      - name: Download APK
        run: |
          set -e
          mkdir -p work
          python3 -m pip install --quiet --break-system-packages gdown
          echo "Downloading base.apk from Google Drive..."
          gdown "1Vd107Bv_AdULQ6wNG66dRXOyfdltiMdX" -O work/base.apk
          file work/base.apk
          ls -lh work/base.apk
          unzip -tq work/base.apk >/dev/null
          unzip -l work/base.apk | grep -q 'AndroidManifest.xml'
          echo "Valid ZIP/APK detected"
      - name: Verify APK
        run: |
          set -e
          sha256sum work/base.apk
          test -s work/base.apk

      - name: Install Apktool
        run: |
          set -e
          mkdir -p tools
          curl -fL --retry 2 --retry-all-errors https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o tools/apktool.jar
          java -jar tools/apktool.jar --version


      - name: Install JADX
        run: |
          set -e
          mkdir -p tools
          curl -fL --retry 2 --retry-all-errors https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o tools/jadx.zip
          rm -rf tools/jadx
          mkdir -p tools/jadx
          unzip -q tools/jadx.zip -d tools/jadx
          chmod +x tools/jadx/bin/jadx
          tools/jadx/bin/jadx --version

      - name: Analyze DEX and EDS symbols
        run: |
          set -e
          rm -rf work/jadx
          mkdir -p work/jadx
          set +e
          tools/jadx/bin/jadx --no-res --no-imports --show-bad-code -d work/jadx work/base.apk
          JADX_EXIT=$?
          echo "JADX exit code: $JADX_EXIT"
          set -e
          echo "=== EDS / KeyStore symbol hits ==="
          grep -RniE 'EdsActivity|FileRepositoryImpl|CertificateUtils|KeyStoreLoader|KeyStoreExtracter|KeyStoreWrapper|AppKeyStore|EdsProductionUtils|getP12Directory|getFileForAuth|getFileForSign|getFileGost|AndroidKeyStore|mgov_keystore' work/jadx 2>/dev/null | head -n 500 || true

          echo "=== TARGET SOURCE FILES ==="
          find work/jadx/sources -type f \
            \( -name 'EdsActivity.java' -o -name 'FileRepositoryImpl.java' -o -name 'CertificateUtils.java' \
            -o -name 'KeyStoreLoader.java' -o -name 'KeyStoreExtracter.java' -o -name 'KeyStoreWrapper.java' \
            -o -name 'AppKeyStore.java' -o -name 'EdsProductionUtils.java' \ -o -name 'CertificateInfoFragment.java' -o -name 'CertificationInfoFragment.java' \
            -o -name 'FileExplorerActivity.java' -o -name '*Certificate*.java' -o -name '*Eds*ViewModel.java' \) \
            -print | sort

          echo "=== TARGET SOURCE CONTENT ==="
          while IFS= read -r f; do
            echo
            echo "===== FILE: $f ====="
            sed -n '1,500p' "$f"
          done < <(find work/jadx/sources -type f \
            \( -name 'EdsActivity.java' -o -name 'FileRepositoryImpl.java' -o -name 'CertificateUtils.java' \
            -o -name 'KeyStoreLoader.java' -o -name 'KeyStoreExtracter.java' -o -name 'KeyStoreWrapper.java' \
            -o -name 'AppKeyStore.java' -o -name 'EdsProductionUtils.java' \) \
            -print | sort)

          echo "=== EDS UI / EXPORT TARGETS ==="
          find work/jadx/sources -type f \
            \( -name 'CertificateInfoFragment.java' -o -name 'CertificationInfoFragment.java' \
            -o -name 'FileExplorerActivity.java' -o -name '*Certificate*ViewModel.java' \) \
            -print | sort

          echo "=== EDS UI / EXPORT SOURCE ==="
          while IFS= read -r f; do
            echo
            echo "===== FILE: $f ====="
            grep -nE -C 35 'exportFileToDownloads|setOnClickListener|setText|certificateFile|Certificate|Downloads|download|share|menu|button' "$f" 2>/dev/null | head -n 500 || true
          done < <(find work/jadx/sources -type f \
            \( -name 'CertificateInfoFragment.java' -o -name 'CertificationInfoFragment.java' \
            -o -name 'FileExplorerActivity.java' -o -name '*Certificate*ViewModel.java' \) \
            -print | sort)

          echo "=== CERTIFICATE / EDS SOURCE CONTENT ==="
          while IFS= read -r f; do
            echo
            echo "===== FILE: $f ====="
            sed -n '1,650p' "$f"
          done < <(find work/jadx/sources -type f -name 'CertificateInfoFragment.java' -o -name 'CertificationInfoFragment.java' -o -name '*Certificate*.java' -o -name '*Eds*ViewModel.java' | sort)

          echo "=== TARGET METHOD CONTEXT ==="
          grep -RniE -C 25 'getP12Directory|getP12Files|getFileForAuth|getFileForSign|getFileGost|exportFileToDownloads|certificateFileForAuth|certificateFileForSign|certificateFileGost|AndroidKeyStore|mgov_keystore|getCertificate\(|getKey\(' work/jadx/sources 2>/dev/null | head -n 3500 || true


      - name: Decode APK with Apktool
        run: |
          set -e
          rm -rf work/decoded
          java -jar tools/apktool.jar d work/base.apk -o work/decoded --force
          test -f work/decoded/AndroidManifest.xml
          echo "Apktool decode completed"
          du -sh work/decoded


      - name: Patch certificate export
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root = Path("work/decoded")
          layout = next(root.rglob("fragment_certificate_info.xml"), None)
          if layout is None:
              raise SystemExit("fragment_certificate_info.xml not found")
          text = layout.read_text(encoding="utf-8")
          if 'android:id="@id/revoke"' not in text and 'android:id="@+id/revoke"' not in text:
              raise SystemExit("revoke button not found")
          import re
          id_pos = text.find('android:id="@id/revoke"')
          if id_pos < 0:
              id_pos = text.find('android:id="@+id/revoke"')
          if id_pos < 0:
              raise SystemExit("revoke view element not found")
          tag_start = text.rfind('<', 0, id_pos)
          tag_end = text.find('>', id_pos)
          if tag_start < 0 or tag_end < 0:
              raise SystemExit("could not locate revoke element bounds")
          button = text[tag_start:tag_end + 1]
          if 'android:id="@+id/export_certificate"' in text:
              raise SystemExit("export button already exists")
          export_button = button
          export_button = export_button.replace('android:id="@id/revoke"', 'android:id="@+id/export_certificate"', 1)
          if 'android:text=' in export_button:
              export_button = re.sub(r'android:text="[^"]*"', 'android:text="Экспортировать сертификат"', export_button, count=1)
          else:
              export_button = export_button.replace('>', ' android:text="Экспортировать сертификат">', 1)
          if 'android:visibility=' in export_button:
              export_button = re.sub(r'android:visibility="[^"]*"', 'android:visibility="visible" android:onClick="exportCertificate"', export_button, count=1)
          else:
              export_button = export_button.replace('>', ' android:visibility="gone">', 1)
          text = text[:tag_start] + export_button + "\\n" + text[tag_start:]
          layout.write_text(text, encoding="utf-8")
          check = layout.read_text(encoding="utf-8")
          if 'android:id="@+id/export_certificate"' not in check:
              raise SystemExit("export button insertion failed")
          print("Certificate layout found:", layout)
          print("Revoke button confirmed")
          print("Export button inserted and made visible with exportCertificate click handler")
          fragment = Path("work/decoded/smali_classes9/kz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment.smali")
          ftext = fragment.read_text(encoding="utf-8")
          if ".method public final getCertificatePem()Ljava/lang/String;" not in ftext:
              fmethod = "\n".join([
                  "    .method public final getCertificatePem()Ljava/lang/String;",
                  "        .locals 1",
                  "",
                  "        iget-object v0, p0, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;->certificate:Lkz/mobile/mgov/core/model/Certificate;",
                  "        if-eqz v0, :pem_null",
                  "        invoke-virtual {v0}, Lkz/mobile/mgov/core/model/Certificate;->getPem()Ljava/lang/String;",
                  "        move-result-object v0",
                  "        return-object v0",
                  "",
                  "        :pem_null",
                  "        const/4 v0, 0x0",
                  "        return-object v0",
                  "    .end method",
                  "",
              ])
              ftext = ftext.rstrip() + "\n\n" + fmethod
              fragment.write_text(ftext, encoding="utf-8")
          print("CertificateInfoFragment PEM getter added")
          eds = Path("work/decoded/smali_classes9/kz/mobile/mgov/features/eds/presentation/EdsActivity.smali")
          etext = eds.read_text(encoding="utf-8")
          if ".method public exportCertificate(Landroid/view/View;)V" not in etext:
              emethod = "\n".join([
                  "    .method public exportCertificate(Landroid/view/View;)V",
                  "        .locals 5",
                  "",
                  "        invoke-virtual {p0}, Landroidx/fragment/app/FragmentActivity;->getSupportFragmentManager()Landroidx/fragment/app/FragmentManager;",
                  "        move-result-object v0",
                  "        sget v1, Lkz/mobile/mgov/R$id;->edsCreationContainer:I",
                  "        invoke-virtual {v0, v1}, Landroidx/fragment/app/FragmentManager;->findFragmentById(I)Landroidx/fragment/app/Fragment;",
                  "        move-result-object v0",
                  "        instance-of v1, v0, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;",
                  "        if-eqz v1, :export_done",
                  "        check-cast v0, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;",
                  "        invoke-virtual {v0}, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;->getCertificatePem()Ljava/lang/String;",
                  "        move-result-object v0",
                  "        if-eqz v0, :export_done",
                  "",
                  "        invoke-virtual {p0}, Landroid/app/Activity;->getContentResolver()Landroid/content/ContentResolver;",
                  "        move-result-object v1",
                  "        new-instance v2, Landroid/content/ContentValues;",
                  "        invoke-direct {v2}, Landroid/content/ContentValues;-><init>()V",
                  "        const-string v3, \"_display_name\"",
                  "        const-string v4, \"egov_certificate.pem\"",
                  "        invoke-virtual {v2, v3, v4}, Landroid/content/ContentValues;->put(Ljava/lang/String;Ljava/lang/String;)V",
                  "        const-string v3, \"mime_type\"",
                  "        const-string v4, \"application/x-pem-file\"",
                  "        invoke-virtual {v2, v3, v4}, Landroid/content/ContentValues;->put(Ljava/lang/String;Ljava/lang/String;)V",
                  "        const-string v3, \"relative_path\"",
                  "        const-string v4, \"Download/\"",
                  "        invoke-virtual {v2, v3, v4}, Landroid/content/ContentValues;->put(Ljava/lang/String;Ljava/lang/String;)V",
                  "        sget-object v3, Landroid/provider/MediaStore$Downloads;->EXTERNAL_CONTENT_URI:Landroid/net/Uri;",
                  "        invoke-virtual {v1, v3, v2}, Landroid/content/ContentResolver;->insert(Landroid/net/Uri;Landroid/content/ContentValues;)Landroid/net/Uri;",
                  "        move-result-object v2",
                  "        if-eqz v2, :export_done",
                  "        invoke-virtual {v1, v2}, Landroid/content/ContentResolver;->openOutputStream(Landroid/net/Uri;)Ljava/io/OutputStream;",
                  "        move-result-object v3",
                  "        if-eqz v3, :export_done",
                  "        const-string v4, \"UTF-8\"",
                  "        invoke-static {v4}, Ljava/nio/charset/Charset;->forName(Ljava/lang/String;)Ljava/nio/charset/Charset;",
                  "        move-result-object v4",
                  "        invoke-virtual {v0, v4}, Ljava/lang/String;->getBytes(Ljava/nio/charset/Charset;)[B",
                  "        move-result-object v4",
                  "        invoke-virtual {v3, v4}, Ljava/io/OutputStream;->write([B)V",
                  "        invoke-virtual {v3}, Ljava/io/OutputStream;->close()V",
                  "",
                  "    :export_done",
                  "        return-void",
                  "    .end method",
                  "",
              ])
              etext = etext.rstrip() + "\n\n" + emethod
              eds.write_text(etext, encoding="utf-8")
          print("EdsActivity exportCertificate handler connected to PEM getter")
          PY

      - name: Verify certificate export patch
        run: |
          set -e
          test -f work/decoded/smali_classes9/kz/mobile/mgov/features/eds/presentation/EdsActivity.smali
          echo "EdsActivity smali found"
          grep -q 'fragmentsHashMap' work/decoded/smali_classes9/kz/mobile/mgov/features/eds/presentation/EdsActivity.smali
          echo "EdsActivity fragment map confirmed"

          python3 - <<'PY'
          from pathlib import Path
          smali = Path("work/decoded/smali_classes9/kz/mobile/mgov/features/eds/presentation/EdsActivity.smali")
          text = smali.read_text(encoding="utf-8")
          if ".method public exportCertificate(Landroid/view/View;)V" not in text:
              raise SystemExit("exportCertificate method not found")
          print("exportCertificate handler method confirmed")
          PY


      - name: Build patched APK
        run: |
          set -e
          rm -rf work/build
          java -jar tools/apktool.jar b work/decoded -o work/egov-patched-unsigned.apk
          test -s work/egov-patched-unsigned.apk
          echo "Patched APK built"
          ls -lh work/egov-patched-unsigned.apk
