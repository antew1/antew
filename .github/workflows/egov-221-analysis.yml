name: eGov 2.2.1 Tooling Diagnostic
# retry after GitHub startup failure

on:
  push:
    paths:
      - ".github/workflows/egov-221-analysis.yml"
  workflow_dispatch:
    inputs:
      apkm_url:
        description: "HTTPS link to the eGov 2.2.1 APKM (Google Drive share link or direct file URL)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  tooling-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download and validate eGov 2.2.1 APKM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file python3
          python3 -m pip install --user --break-system-packages gdown
          export PATH="$HOME/.local/bin:$PATH"
          input_url="${{ github.event.inputs.apkm_url }}"
          if [ -z "$input_url" ]; then
            input_url="https://drive.google.com/file/d/1RRR5zm2kssTsiHObxssxxVFUjw7ZKiUc/view?usp=drivesdk"
          fi
          python3 - "$input_url" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          from urllib.parse import urlparse, parse_qs
          u=urlparse(sys.argv[1])
          if u.scheme != "https" or not u.hostname:
              raise SystemExit("APKM URL must use HTTPS")
          host=u.hostname.lower()
          file_id=""
          if host in ("drive.google.com", "www.drive.google.com"):
              parts=[p for p in u.path.split("/") if p]
              if len(parts)>=3 and parts[0]=="file" and parts[1]=="d":
                  file_id=parts[2]
              else:
                  file_id=parse_qs(u.query).get("id", [""])[0]
              if not file_id or not file_id.replace("-", "").replace("_", "").isalnum():
                  raise SystemExit("Could not extract a valid Google Drive file ID")
              print("source=drive")
              print("file_id="+file_id)
          else:
              print("source=direct")
              print("url="+sys.argv[1])
          PY
          source="$(sed -n 's/^source=//p' "$GITHUB_OUTPUT" | tail -n1)"
          if [ "$source" = "drive" ]; then
            file_id="$(sed -n 's/^file_id=//p' "$GITHUB_OUTPUT" | tail -n1)"
            gdown "https://drive.google.com/uc?id=$file_id" -O /tmp/egov-2.2.1.apkm
          else
            curl -fL "$input_url" -o /tmp/egov-2.2.1.apkm
          fi
          test -s /tmp/egov-2.2.1.apkm
          file /tmp/egov-2.2.1.apkm
          unzip -t /tmp/egov-2.2.1.apkm
          unzip -Z1 /tmp/egov-2.2.1.apkm | grep -E '(^|/)base\.apk$'
          unzip -p /tmp/egov-2.2.1.apkm info.json > /tmp/egov-info.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/egov-info.json"))
          assert p.get("pname") == "kz.mobile.mgov", p.get("pname")
          assert p.get("release_version") == "2.2.1", p.get("release_version")
          print("Validated:", p["app_name"], p["release_version"], p["pname"])
          PY
          echo "APKM_DOWNLOAD_VALIDATION_OK"
      - name: Confirm runner and install Apktool
        run: |
          set -euo pipefail
          echo "RUNNER_STARTED"
          java -version
          sudo apt-get install -y apktool
          apktool --version
      - name: Install and verify JADX
        run: |
          set -euo pipefail
          sudo apt-get install -y jq
          release_json="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)"
          asset_json="$(printf '%s' "$release_json" | jq -c '[.assets[] | select(.name | startswith("jadx-") and endswith(".zip"))][0] // empty')"
          test -n "$asset_json"
          asset_api_url="$(printf '%s' "$asset_json" | jq -r '.url')"
          asset_url="$(printf '%s' "$asset_json" | jq -r '.browser_download_url')"
          test -n "$asset_api_url"
          test -n "$asset_url"
          if ! curl -fL -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2026-03-10" "$asset_api_url" -o /tmp/jadx.zip; then
            echo "GitHub asset API download failed; retrying browser download URL"
            curl -fL --retry 3 --retry-all-errors "$asset_url" -o /tmp/jadx.zip
          fi
          file /tmp/jadx.zip
          unzip -t /tmp/jadx.zip
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          test -x /opt/jadx/bin/jadx
          /opt/jadx/bin/jadx --version
          echo "TOOLING_DIAGNOSTIC_OK"
      - name: Extract and verify base APK
        run: |
          set -euo pipefail
          unzip -p /tmp/egov-2.2.1.apkm base.apk > /tmp/egov-base.apk
          test -s /tmp/egov-base.apk
          file /tmp/egov-base.apk
          unzip -t /tmp/egov-base.apk
          echo "BASE_APK_EXTRACTION_OK"
      - name: Decode base APK with Apktool
        run: |
          set -euo pipefail
          apktool d /tmp/egov-base.apk -o /tmp/egov-decoded
          test -s /tmp/egov-decoded/AndroidManifest.xml
          test -s /tmp/egov-decoded/apktool.yml
          find /tmp/egov-decoded -maxdepth 1 -type d -name 'smali*' -print -quit | grep -q .
          echo "APKTOOL_DECODE_OK"
      - name: Decompile base APK with JADX and locate certificate UI
        run: |
          set -euo pipefail
          set +e
          /opt/jadx/bin/jadx -d /tmp/egov-jadx /tmp/egov-base.apk
          jadx_status=$?
          set -e
          test -d /tmp/egov-jadx/sources
          echo "JADX_EXIT_CODE=$jadx_status"
          echo "JADX_SOURCE_FILE_COUNT=$(find /tmp/egov-jadx/sources -type f -name '*.java' | wc -l)"
          find /tmp/egov-jadx/sources -type f \( -iname '*Certificate*' -o -iname '*EdsActivity*' \) -print | sort | head -n 100
          grep -RIlE 'CertificateInfoFragment|CertificateUtils|EdsActivity|certificate' /tmp/egov-jadx/sources | sort | head -n 100 || true
          echo "=== CertificateInfoFragment.java ==="
          sed -n '1,260p' /tmp/egov-jadx/sources/kz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment.java
          echo "=== Certificate.java ==="
          sed -n '1,240p' /tmp/egov-jadx/sources/kz/mobile/mgov/core/model/Certificate.java
          echo "=== CertificateUtils.java ==="
          sed -n '1,240p' /tmp/egov-jadx/sources/kz/mobile/mgov/core/security/CertificateUtils.java
          echo "=== EdsActivity.java ==="
          sed -n '1,220p' /tmp/egov-jadx/sources/kz/mobile/mgov/features/eds/presentation/EdsActivity.java
          echo "=== PEM generation contexts ==="
          grep -RIn -B 14 -A 18 "certificate.setPem\|certificate2.setPem\|setPem(x509" /tmp/egov-jadx/sources/kz/mobile/mgov/core 2>/dev/null | head -n 220 || true
          echo "=== CertificateInfoFragment launch and argument contexts ==="
          grep -RIn -B 8 -A 12 "CertificateInfoFragment\|IntentConstants.CERTIFICATE" /tmp/egov-jadx/sources/kz/mobile/mgov/features/eds 2>/dev/null | head -n 260 || true
          echo "=== CertificateUtils PEM population ==="
          sed -n '210,255p' /tmp/egov-jadx/sources/kz/mobile/mgov/core/security/CertificateUtils.java
          sed -n '305,345p' /tmp/egov-jadx/sources/kz/mobile/mgov/core/security/CertificateUtils.java
          echo "=== EdsViewModel certificate flows ==="
          sed -n '1630,1675p' /tmp/egov-jadx/sources/kz/mobile/mgov/features/eds/presentation/EdsViewModel.java
          sed -n '1795,1835p' /tmp/egov-jadx/sources/kz/mobile/mgov/features/eds/presentation/EdsViewModel.java
          echo "=== Certificate object creation and navigation ==="
          grep -RInE 'new Certificate\(|CERTIFICATE\)|CERTIFICATE,' /tmp/egov-jadx/sources/kz/mobile/mgov/features/eds 2>/dev/null | head -n 100 || true
          echo "=== Certificate creation and screen navigation ==="
          grep -RInE "getCertificateDatasFromX509|CertificateInfoFragment|CERTIFICATE\)" /tmp/egov-jadx/sources/kz/mobile/mgov/core /tmp/egov-jadx/sources/kz/mobile/mgov/features/eds 2>/dev/null | head -n 220 || true
          echo "=== CertificateUtils X509 constructors ==="
          sed -n '210,350p' /tmp/egov-jadx/sources/kz/mobile/mgov/core/security/CertificateUtils.java
          echo "=== certificate info layout ==="
          sed -n '1,260p' /tmp/egov-decoded/res/layout/fragment_certificate_info.xml
          echo "=== certificate resource references ==="
          grep -RInE 'certificate_info|certificate.*(export|save)|export.*certificate|Сертификат|сертификат' /tmp/egov-decoded/res/values /tmp/egov-decoded/res/layout 2>/dev/null | head -n 160 || true
          echo "CERTIFICATE_SOURCE_EXCERPTS_OK"
          echo "CERTIFICATE_SOURCE_INVENTORY_OK"
      - name: Print verified certificate patch inputs
        run: |
          set -euo pipefail
          fragment="$(find /tmp/egov-decoded -type f -path '*/kz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment.smali' -print -quit)"
          model="$(find /tmp/egov-decoded -type f -path '*/kz/mobile/mgov/core/model/Certificate.smali' -print -quit)"
          layout="$(find /tmp/egov-decoded -type f -path '*/res/layout/fragment_certificate_info.xml' -print -quit)"
          test -s "$fragment"
          test -s "$model"
          test -s "$layout"
          echo "=== CERTIFICATE_INFO_FRAGMENT_SMALI_BEGIN ==="
          cat "$fragment"
          echo "=== CERTIFICATE_INFO_FRAGMENT_SMALI_END ==="
          echo "=== CERTIFICATE_MODEL_SMALI_BEGIN ==="
          cat "$model"
          echo "=== CERTIFICATE_MODEL_SMALI_END ==="
          echo "=== CERTIFICATE_INFO_LAYOUT_BEGIN ==="
          cat "$layout"
          echo "=== CERTIFICATE_INFO_LAYOUT_END ==="
          echo "CERTIFICATE_PATCH_INPUTS_LOGGED"

      - name: Verify manifest storage compatibility and PEM navigation chain
        run: |
          set -euo pipefail
          echo "=== apktool sdk metadata ==="
          grep -nE 'minSdkVersion|targetSdkVersion|versionCode|versionName' /tmp/egov-decoded/apktool.yml || true
          echo "=== manifest package/version/storage permissions ==="
          grep -nE 'manifest|uses-sdk|WRITE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE' /tmp/egov-decoded/AndroidManifest.xml || true
          echo "=== CertificateUtils PEM creation ==="
          grep -RIn -B 18 -A 10 'setPem(Ljava/security/cert/X509Certificate;)' /tmp/egov-decoded/smali*/*/mobile/mgov/core/security/CertificateUtils.smali 2>/dev/null || true
          echo "=== Certificate model PEM accessors ==="
          grep -RIn -B 5 -A 18 -E 'method public.*getPem|method public.*setPem' /tmp/egov-decoded/smali*/*/mobile/mgov/core/model/Certificate.smali 2>/dev/null || true
          echo "=== CertificateInfoFragment certificate argument ==="
          fragment="$(find /tmp/egov-decoded -type f -path '*/kz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment.smali' -print -quit)"
          grep -n -B 12 -A 28 -E 'const-string .*"certificate"|->certificate:Lkz/mobile/mgov/core/model/Certificate;' "$fragment" || true
          echo "=== navigation sites passing certificate ==="
          grep -RIn -B 12 -A 18 -E 'CertificateInfoFragment|const-string .*"certificate"|putSerializable' /tmp/egov-decoded/smali_classes9/kz/mobile/mgov/features/eds 2>/dev/null | head -n 500 || true
          echo "MANIFEST_AND_PEM_CHAIN_DIAGNOSTIC_OK"

      - name: Patch certificate export UI and implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("/tmp/egov-decoded")
          frag=next(root.glob("smali_classes9/kz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment.smali"))
          layout=root/"res/layout/fragment_certificate_info.xml"
          s=layout.read_text()
          marker='<Button android:textColor="@color/redTextColor" android:id="@id/revoke"'
          export='<Button android:tag="certificate_export_button" android:textColor="@android:color/black" android:background="@color/white" android:layout_width="fill_parent" android:layout_height="wrap_content" android:layout_marginTop="16.0dip" android:text="Экспортировать сертификат" android:textAllCaps="false" android:fontFamily="@font/open_sans" android:layout_marginStart="20.0dip" android:layout_marginEnd="20.0dip" app:layout_constraintEnd_toEndOf="parent" app:layout_constraintStart_toStartOf="parent" app:layout_constraintTop_toBottomOf="@id/certificate_date" />\n            '
          if marker not in s: raise SystemExit("revoke button marker not found")
          s=s.replace(marker,export+marker,1)
          s=s.replace('app:layout_constraintTop_toBottomOf="@id/certificate_date" />\n            <TextView', 'app:layout_constraintTop_toBottomOf="@id/certificate_date" />\n            <TextView',1)
          # Revoke must sit below the injected button. Constraint by tag is impossible, so keep visual export button
          # after certificate card and place listener by tag; revoke may overlap unless we give export bottom margin
          # and change revoke top margin enough. Use 72dp top margin for deterministic non-overlap.
          old='android:id="@id/revoke" android:background="@color/white" android:layout_width="fill_parent" android:layout_height="wrap_content" android:layout_marginTop="16.0dip"'
          new='android:id="@id/revoke" android:background="@color/white" android:layout_width="fill_parent" android:layout_height="wrap_content" android:layout_marginTop="72.0dip"'
          if old not in s: raise SystemExit("revoke margin marker not found")
          s=s.replace(old,new,1)
          layout.write_text(s)

          fs=frag.read_text()
          needle='    invoke-direct {p0, p1}, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;->bindViews(Landroid/view/View;)V\n'
          inject='''    invoke-direct {p0, p1}, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;->bindViews(Landroid/view/View;)V
          
          const-string v0, "certificate_export_button"
          
          invoke-virtual {p1, v0}, Landroid/view/View;->findViewWithTag(Ljava/lang/Object;)Landroid/view/View;
          
          move-result-object v0
          
          check-cast v0, Landroid/widget/Button;
          
          new-instance p2, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateExportClickListener;
          
          invoke-direct {p2, p0}, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateExportClickListener;-><init>(Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;)V
          
          invoke-virtual {v0, p2}, Landroid/widget/Button;->setOnClickListener(Landroid/view/View$OnClickListener;)V
          '''
          if needle not in fs: raise SystemExit("onViewCreated bindViews marker not found")
          fs=fs.replace(needle,inject,1)
          frag.write_text(fs)

          pkg=frag.parent
          (pkg/"CertificateExportClickListener.smali").write_text(r'''.class public final Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateExportClickListener;
          .super Ljava/lang/Object;
          .implements Landroid/view/View$OnClickListener;
          
          .field private final fragment:Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;
          
          .method public constructor <init>(Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;)V
          .locals 0
          invoke-direct {p0}, Ljava/lang/Object;-><init>()V
          iput-object p1, p0, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateExportClickListener;->fragment:Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;
          return-void
          .end method
          
          .method public onClick(Landroid/view/View;)V
          .locals 3
          iget-object v0, p0, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateExportClickListener;->fragment:Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;
          invoke-static {v0}, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;->access$getCertificate$p(Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;)Lkz/mobile/mgov/core/model/Certificate;
          move-result-object v1
          if-eqz v1, :done
          invoke-virtual {v1}, Lkz/mobile/mgov/core/model/Certificate;->getPem()Ljava/lang/String;
          move-result-object v1
          if-eqz v1, :done
          invoke-virtual {v1}, Ljava/lang/String;->length()I
          move-result v2
          if-lez v2, :done
          invoke-virtual {v0}, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateInfoFragment;->requireContext()Landroid/content/Context;
          move-result-object v0
          invoke-static {v0, v1}, Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateExporter;->export(Landroid/content/Context;Ljava/lang/String;)V
          :done
          return-void
          .end method
          ''')
          (pkg/"CertificateExporter.smali").write_text(r'''.class public final Lkz/mobile/mgov/features/eds/presentation/my_eds/CertificateExporter;
          .super Ljava/lang/Object;
          
          .method public static export(Landroid/content/Context;Ljava/lang/String;)V
          .locals 9
          :try_start
          new-instance v0, Ljava/text/SimpleDateFormat;
          const-string v1, "yyyyMMdd_HHmmss"
          sget-object v2, Ljava/util/Locale;->US:Ljava/util/Locale;
          invoke-direct {v0, v1, v2}, Ljava/text/SimpleDateFormat;-><init>(Ljava/lang/String;Ljava/util/Locale;)V
          new-instance v1, Ljava/util/Date;
          invoke-direct {v1}, Ljava/util/Date;-><init>()V
          invoke-virtual {v0, v1}, Ljava/text/SimpleDateFormat;->format(Ljava/util/Date;)Ljava/lang/String;
          move-result-object v0
          new-instance v1, Ljava/lang/StringBuilder;
          invoke-direct {v1}, Ljava/lang/StringBuilder;-><init>()V
          const-string v2, "certificate_"
          invoke-virtual {v1, v2}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
          invoke-virtual {v1, v0}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
          const-string v0, ".pem"
          invoke-virtual {v1, v0}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
