name: eGov 2.2.1 Runner Diagnostic

on:
  push:
    paths:
      - ".github/workflows/egov-221-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner startup
        run: |
          set -e
          echo "RUNNER_STARTED"
          echo "OS:"
          uname -a
          echo "Java:"
          java -version
          echo "Python:"
          python3 --version
          echo "Git:"
          git --version
          echo "DIAGNOSTIC_OK"
