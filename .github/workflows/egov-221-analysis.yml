name: eGov 2.2.1 Tooling Diagnostic

on:
  push:
    paths:
      - ".github/workflows/egov-221-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and validate eGov 2.2.1 APKM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file
          url="https://drive.google.com/uc?export=download&id=1RRR5zm2kssTsiHObxssxxVFUjw7ZKiUc"
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/egov-2.2.1.apkm
          test -s /tmp/egov-2.2.1.apkm
          file /tmp/egov-2.2.1.apkm
          if ! unzip -tq /tmp/egov-2.2.1.apkm >/dev/null 2>&1; then
            echo "Downloaded response is not a valid APKM archive."
            head -c 500 /tmp/egov-2.2.1.apkm || true
            exit 1
          fi
          unzip -t /tmp/egov-2.2.1.apkm
          unzip -Z1 /tmp/egov-2.2.1.apkm | grep -E '(^|/)base\.apk$'
          echo "APKM_DOWNLOAD_VALIDATION_OK"
      - name: Confirm runner and install Apktool
        run: |
          set -euo pipefail
          echo "RUNNER_STARTED"
          java -version
          sudo apt-get install -y apktool
          apktool --version
      - name: Install and verify JADX
        run: |
          set -euo pipefail
          sudo apt-get install -y jq
          release_json="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)"
          asset_url="$(printf '%s' "$release_json" | jq -r '[.assets[] | select(.name | test("^jadx-[0-9.]+\\.zip$"))][0].browser_download_url // empty')"
          test -n "$asset_url"
          curl -fL "$asset_url" -o /tmp/jadx.zip
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          test -x /opt/jadx/bin/jadx
          /opt/jadx/bin/jadx --version
          echo "TOOLING_DIAGNOSTIC_OK"
